<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आन्तरिक नियन्त्रण प्रणाली | बाणगंगा नगरपालिका, कपिलवस्तु</title>
    <!-- FontAwesome 6 & Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/epalika-admin.css?v=2.9">
</head>
<body>

    <!-- =====================================================================
         1. Official Header (Exact Match to PDF Page 1)
         ===================================================================== -->
    <header class="official-header">
        <div class="official-header-top">
            <!-- Centered Municipality Identity (Logo 1 + Font/Title + Logo 2) -->
            <div class="mun-official-box">
                <img src="logo 1.jpg" alt="बाणगंगा नगरपालिका लोगो १" class="mun-header-logo" width="100" height="100" style="width:100px; height:100px; max-width:100px; max-height:100px; object-fit:contain; display:inline-block;">
                <div class="mun-text-container">
                    <div class="mun-name-text font-devanagari">बाणगंगा नगरपालिका, कपिलवस्तु</div>
                    <div class="mun-sub-text font-devanagari">लुम्बिनी प्रदेश नेपाल</div>
                </div>
                <img src="logo 2.jpg" alt="बाणगंगा नगरपालिका लोगो २" class="mun-header-logo" width="100" height="100" style="width:100px; height:100px; max-width:100px; max-height:100px; object-fit:contain; display:inline-block;">
            </div>
        </div>

        <!-- Center Pill: आन्तरिक नियन्त्रण प्रणाली -->
        <div class="system-title-box">
            <span class="system-title-pill font-devanagari">
                आन्तरिक नियन्त्रण प्रणाली
            </span>
        </div>
    </header>

    <!-- =====================================================================
         2. Official 8 Top Tabs Navigation (Exact Match to PDF Page 1)
         ===================================================================== -->
    <nav class="official-nav-bar">
        <ul class="official-tabs">
            <li>
                <button class="official-tab-btn" data-tab="settings">
                    <i class="fa-solid fa-sliders"></i> सेटिङ
                </button>
            </li>
            <li>
                <button class="official-tab-btn active" data-tab="employees">
                    <i class="fa-solid fa-users"></i> कर्मचारी
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="palika_profile">
                    <i class="fa-solid fa-landmark"></i> पालिका प्रोफाइल
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="wards">
                    <i class="fa-solid fa-map-location-dot"></i> वडा कार्यालय
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="cooperative">
                    <i class="fa-solid fa-handshake-angle"></i> सहकारी
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="drinking_water">
                    <i class="fa-solid fa-faucet-drip"></i> खानेपानी
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="forest">
                    <i class="fa-solid fa-tree"></i> वन
                </button>
            </li>
            <li>
                <button class="official-tab-btn" data-tab="organization">
                    <i class="fa-solid fa-sitemap"></i> संघसंस्था
                </button>
            </li>
        </ul>

        <div class="nav-actions-right d-flex align-items-center gap-2">
            <!-- Logged-in User Symbol & Role Badge (Clickable for Switch Account) -->
            <div class="nav-user-identity" id="btn-open-login-modal" role="button" title="खाता परिवर्तन वा लगईन गर्न थिच्नुहोस्">
                <span id="current-user-avatar-symbol" class="user-role-symbol">
                    <i class="fa-solid fa-user-shield text-danger"></i>
                </span>
                <span class="badge bg-danger font-devanagari" id="current-user-role-badge">Super Admin</span>
            </div>

            <!-- Logout Button -->
            <button class="btn btn-sm btn-outline-danger font-devanagari fw-bold" id="btn-header-logout" title="प्रणालीबाट बाहिर निस्कनुहोस्">
                <i class="fa-solid fa-power-off me-1"></i> बाहिर (Logout)
            </button>
        </div>
    </nav>

    <!-- =====================================================================
         3. Dynamic Main Content Area
         ===================================================================== -->
    <main class="content-wrapper" id="main-content-display">
        <!-- Injected dynamically via JS based on selected tab -->
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-muted small bg-white border-top mt-5">
        <div>© २०८३ बाणगंगा नगरपालिका नगर कार्यपालिकाको कार्यालय, जीतपुर, कपिलवस्तु।</div>
        <div class="text-secondary">प्राविधिक विकास: <strong>ePalika.com</strong> आन्तरिक नियन्त्रण प्रणाली</div>
    </footer>

    <!-- Global Modals Mount Points -->
    <div id="login-modal-mount"></div>
    <div id="toast-mount"></div>
    <div id="master-quick-modal-mount"></div>
    <div id="multifilter-modal-mount"></div>
    <div id="ward-modal-mount"></div>
    <div id="delete-modal-mount"></div>
    <div id="role-assignment-modal-mount"></div>
    <div id="excel-import-modal-mount"></div>

    <!-- Core Scripts with Cache Buster -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/epalika-unicode.js?v=2.9"></script>
    <script src="js/epalika-nepali-date.js?v=2.9"></script>
    <script src="js/epalika-db.js?v=2.9"></script>
    <script src="js/epalika-app.js?v=2.9"></script>
</body>
</html>
